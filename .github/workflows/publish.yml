# upload-tmp 가지에 올라온 설치 파일 조각을 합쳐서 릴리스로 올리고, 임시 가지는 지움
name: publish
on:
  push:
    branches: [upload-tmp]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload-tmp
      - name: 합치고 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(cat parts/VERSION)
          mkdir -p out
          for f in $(ls parts/*.part-aa | sed 's/\.part-aa$//'); do cat "$f".part-* > "out/$(basename "$f")"; done
          (cd out && sha256sum *) > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --target main --title "Apnea Hub $VER" --notes "Windows: .exe / Mac: .dmg. 처음 실행 방법: https://apnea-hub-site-varuna-s-projects.vercel.app/guide.html"
          gh release upload "v$VER" out/* --clobber
          git push origin --delete upload-tmp
